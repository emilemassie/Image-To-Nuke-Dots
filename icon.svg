<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Nuke UI Dark Gray) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>

    <!-- Nuke Orange Highlight Gradient -->
    <linearGradient id="nukeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E55B00"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS Style Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#3A3A3A" stroke-width="4" filter="url(#dropShadow)"/>

  <!-- Inner Subtle Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Left Side: Source Image Metaphor (Landscape Picture) -->
  <g opacity="0.85" filter="url(#dropShadow)">
    <path d="M 120 180 L 220 180 L 220 330 L 120 330 Z" fill="none" stroke="#555555" stroke-width="6" stroke-dasharray="8 6"/>
    <!-- Mountain / Image Graphic -->
    <polygon points="130,310 165,240 190,280 205,260 220,310" fill="#666666"/>
    <circle cx="150" cy="220" r="12" fill="#888888"/>
  </g>

  <!-- Middle: Transition Arrow / Nuke Pipe -->
  <path d="M 235 256 L 275 256" stroke="url(#nukeOrange)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 12"/>
  <polygon points="275,246 295,256 275,266" fill="url(#nukeOrange)"/>

  <!-- Right Side: Nuke Dot Node Graph Art -->
  <g filter="url(#dropShadow)">
    <!-- Node Connection Pipes -->
    <path d="M 320 160 L 320 352 M 380 160 L 380 352 M 320 226 L 380 226 M 320 286 L 380 286" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Dot Nodes (Colorful Pixels) -->
    <!-- Row 1 -->
    <circle cx="320" cy="160" r="10" fill="#FF5252"/>
    <circle cx="380" cy="160" r="10" fill="#FF4081"/>

    <!-- Row 2 -->
    <circle cx="320" cy="226" r="12" fill="url(#nukeOrange)" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="380" cy="226" r="10" fill="#7C4DFF"/>

    <!-- Row 3 -->
    <circle cx="320" cy="286" r="10" fill="#00E5FF"/>
    <circle cx="380" cy="286" r="12" fill="url(#nukeOrange)" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Row 4 -->
    <circle cx="320" cy="352" r="10" fill="#69F0AE"/>
    <circle cx="380" cy="352" r="10" fill="#FFD600"/>
  </g>
</svg>
